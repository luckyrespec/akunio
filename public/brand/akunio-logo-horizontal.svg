    <rect x="0.5" y="0.5" width="41" height="41" rx="11.5" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    <g transform="translate(-3, -3)" filter="url(#h-drop-shadow)">
      <path d="M24 8.5L9.5 35.5" stroke="url(#h-stroke-grad)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M24 8.5L38.5 35.5" stroke="url(#h-stroke-grad)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M24 10.5V36" stroke="url(#h-stroke-grad)" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M9.5 35.5C14 32.5 19 33 24 36C29 33 34 32.5 38.5 35.5" stroke="url(#h-stroke-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12.5 38.2C16 36.2 19.8 36.8 24 39C28.2 36.8 32 36.2 35.5 38.2" stroke="url(#h-stroke-grad)" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
      <path d="M15 24.5H33" stroke="url(#h-stroke-grad)" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M13.5 29.5H34.5" stroke="url(#h-stroke-grad)" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="24" cy="24.5" r="2.2" fill="#4ade80"/>
      <path d="M24 6L26.5 8.5L24 11L21.5 8.5Z" fill="#ffffff"/>
