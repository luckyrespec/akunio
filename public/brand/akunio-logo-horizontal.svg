<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 48" fill="none" role="img" aria-label="Akunio Logo Horizontal">
  <defs>
    <linearGradient id="h-terra-gradient" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b66035"/>
      <stop offset="100%" stop-color="#8a3c1a"/>
    </linearGradient>
    <linearGradient id="h-stroke-grad" x1="12" y1="8" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf8f0"/>
    </linearGradient>
    <filter id="h-drop-shadow" x="0" y="2" width="48" height="48" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1.8" stdDeviation="1.8" flood-color="#240c03" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Mark Icon: Geometric A Accounting Book Ledger -->
