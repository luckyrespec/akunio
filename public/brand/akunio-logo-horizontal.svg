  </g>

  <!-- Wordmark Text (Murni Akunio, Tanpa Tagline AI) -->
  <text x="56" y="32.5" font-family="'Fraunces', Georgia, serif" font-size="28" font-weight="700" fill="#232a33" letter-spacing="-0.03em">
    Akunio
