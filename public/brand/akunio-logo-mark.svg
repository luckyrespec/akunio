<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="Akunio Logo Mark">
  <defs>
    <linearGradient id="akunio-terra-bg" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b66035"/>
      <stop offset="100%" stop-color="#8a3c1a"/>
    </linearGradient>
    <linearGradient id="akunio-stroke-grad" x1="12" y1="8" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf8f0"/>
    </linearGradient>
    <filter id="akunio-drop-shadow" x="0" y="2" width="48" height="48" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2.2" stdDeviation="2.2" flood-color="#240c03" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas Matte (Paper & Ink) -->
  <rect x="3" y="3" width="42" height="42" rx="12" fill="url(#akunio-terra-bg)"/>
  <rect x="3.5" y="3.5" width="41" height="41" rx="11.5" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>

  <g filter="url(#akunio-drop-shadow)">
    <!-- Kaki Kiri & Kanan Huruf A (Sampul Luar Buku Akuntansi) -->
    <path d="M24 8.5L9.5 35.5" stroke="url(#akunio-stroke-grad)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24 8.5L38.5 35.5" stroke="url(#akunio-stroke-grad)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Tulang Belakang Buku Tengah (Center Spine Gutter) -->
    <path d="M24 10.5V36" stroke="url(#akunio-stroke-grad)" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Kelengkungan Daun Halaman Buku Bawah (Book Page Arches) -->
    <path d="M9.5 35.5C14 32.5 19 33 24 36C29 33 34 32.5 38.5 35.5" stroke="url(#akunio-stroke-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Lapisan Kertas Buku Arsip Kedua (Multi-page Archive Edge) -->
    <path d="M12.5 38.2C16 36.2 19.8 36.8 24 39C28.2 36.8 32 36.2 35.5 38.2" stroke="url(#akunio-stroke-grad)" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>

    <!-- Mistar Ganda Pembukuan (Accounting Double Rule Balance Crossbars) -->
    <path d="M15 24.5H33" stroke="url(#akunio-stroke-grad)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M13.5 29.5H34.5" stroke="url(#akunio-stroke-grad)" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Titik Saldo Seimbang Emerald (Double-Entry Balance Node) -->
    <circle cx="24" cy="24.5" r="2.2" fill="#4ade80"/>

    <!-- Mahkota Berlian Puncak Buku -->
    <path d="M24 6L26.5 8.5L24 11L21.5 8.5Z" fill="#ffffff"/>
  </g>
</svg>
